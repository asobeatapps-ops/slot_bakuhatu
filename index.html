<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101022"><title>スロットを爆発せよ！ | ASOBEAT</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header class="header"><div class="brand">ASOBEAT <span>★</span></div><button id="soundBtn" class="icon-btn" aria-label="音声切り替え">♪ ON</button></header><main id="main"><section id="titleScreen" class="screen active"><div class="eyebrow">THE MOST RIDICULOUS SLOT CHALLENGE</div><h1>スロットを<br><em>爆発せよ！</em></h1><div class="title-slot"><span>7</span><span>7</span><span>7</span></div><p class="lead">目押しで宇宙までブッ飛ばせ。<br>3本JUSTで <strong>1,000,000m!</strong></p><button class="primary" id="startBtn">▶　爆発させる</button><button class="secondary" id="titleRankBtn">🏆 世界ランキング TOP100</button><div class="best-line">YOUR BEST <strong id="titleBest">—</strong></div></section><section id="gameScreen" class="screen"><div class="hud"><div><small>BEST</small><strong id="hudBest">0m</strong></div><div class="timer"><small>TIME</small><strong id="timeLeft">15.00</strong></div></div><div class="game-caption" id="gameCaption">7を狙え！</div><div class="machine"><div class="machine-top">★　BOMBER SLOT　★</div><canvas id="reels" aria-label="3本のスロットリール"></canvas></div><div class="stop-row"><button class="stop" data-reel="0">STOP</button><button class="stop" data-reel="1">STOP</button><button class="stop" data-reel="2">STOP</button></div><div class="just-row" id="justRow"><span>—</span><span>—</span><span>—</span></div></section><section id="flightScreen" class="screen flight"><canvas id="flightCanvas" aria-label="スロットの上昇演出"></canvas><div class="flight-hud"><div id="bonusLabel">BOOM!</div><strong id="flightHeight">0m</strong></div><div class="big-banner" id="bigBanner"><span>BIG BONUS!</span></div></section><section id="resultScreen" class="screen"><h2 id="resultHeadline">爆発成功！</h2><div class="result-distance"><span>飛距離</span><strong id="resultHeight">0</strong><span>m</span></div><div class="result-title" id="resultTitle">ただの爆発好き</div><div class="result-detail" id="resultDetail"></div><div class="rank-status" id="rankStatus" role="status"></div><button class="primary" id="retryBtn">↻　もう一回！</button><button class="secondary share-x" id="shareXBtn">𝕏　結果をXで共有</button><button class="secondary" id="resultRankBtn">🏆 ランキングを見る</button><button class="text-btn" id="homeBtn">タイトルへ戻る</button></section><section id="rankingScreen" class="screen"><div class="eyebrow">GLOBAL LEADERBOARD</div><h2>世界ランキング <span>TOP100</span></h2><div class="name-box"><label for="playerName">ランキング表示名（任意）</label><div class="name-row"><input id="playerName" maxlength="16" placeholder="匿名プレイヤー"><button id="saveNameBtn">保存</button></div></div><p class="ranking-note" id="rankingNote"></p><div id="rankingList" class="ranking-list"></div><button class="secondary" id="rankBackBtn">← 戻る</button></section></main><footer id="adSlot" aria-label="広告表示領域"><span>ADVERTISEMENT</span></footer></div><script type="module" src="game.js"></script></body></html>
